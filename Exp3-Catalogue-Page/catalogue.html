<!DOCTYPE html>
<html>
<head>
    <title>Catalogue Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #1d3557; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; }
        th, td { border: 1px solid #999; padding: 10px; text-align: center; }
        th { background: #1d3557; color: #fff; }
        button { background: #e63946; color: #fff; border: 0; padding: 8px 14px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Book Catalogue</h2>
    <table>
        <tr>
            <th>Cover Page</th>
            <th>Book</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Price</th>
            <th>Cart</th>
        </tr>
        <tr>
            <td><img src="images/xml-bible.svg" width="80" alt="XML Bible"></td>
            <td>XML Bible</td><td>Winston</td><td>Wiley</td><td>$40.5</td>
            <td><form action="../Exp4-Cart-Page/cart.html"><button type="submit">Add to Cart</button></form></td>
        </tr>
        <tr>
            <td><img src="images/ai.svg" width="80" alt="AI"></td>
            <td>AI</td><td>S. Russell</td><td>Princeton Hall</td><td>$63</td>
            <td><form action="../Exp4-Cart-Page/cart.html"><button type="submit">Add to Cart</button></form></td>
        </tr>
        <tr>
            <td><img src="images/java2.svg" width="80" alt="Java 2"></td>
            <td>Java 2</td><td>Watson</td><td>BPB Publications</td><td>$50</td>
            <td><form action="../Exp4-Cart-Page/cart.html"><button type="submit">Add to Cart</button></form></td>
        </tr>
        <tr>
            <td><img src="images/html24.svg" width="80" alt="HTML in 24 Hours"></td>
            <td>HTML in 24 Hours</td><td>Sam Peter</td><td>Sam Publication</td><td>$35.5</td>
            <td><form action="../Exp4-Cart-Page/cart.html"><button type="submit">Add to Cart</button></form></td>
        </tr>
    </table>
</body>
</html>
