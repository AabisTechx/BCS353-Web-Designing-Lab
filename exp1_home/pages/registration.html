<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Registration</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:16px;background:#f7f7fb;color:#222}
h1,h2{color:#2b3a67}table{border-collapse:collapse;background:#fff}
th,td{border:1px solid #bbb;padding:8px 12px;text-align:left}th{background:#2b3a67;color:#fff}
input[type=text],input[type=password],textarea,select{padding:6px;margin:2px 0}
button,input[type=submit]{background:#2b3a67;color:#fff;border:0;padding:8px 16px;cursor:pointer;border-radius:4px}
.err{color:#c0392b;font-size:13px;display:block;min-height:16px}
.box{background:#fff;border:1px solid #ccc;padding:20px;max-width:560px;border-radius:6px}</style></head><body>
<div class="box"><h2>Registration Form</h2>
<form id="regForm" action="#" method="post">
<p>Name:<br><input type="text" id="name" name="name"><span class="err" id="nameErr"></span></p>
<p>Password:<br><input type="password" id="password" name="password"><span class="err" id="passErr"></span></p>
<p>E-mail ID:<br><input type="text" id="email" name="email"><span class="err" id="emailErr"></span></p>
<p>Phone Number:<br><input type="text" id="phone" name="phone"><span class="err" id="phoneErr"></span></p>
<p>Sex:<br><label><input type="radio" name="sex" value="Male"> Male</label>
<label><input type="radio" name="sex" value="Female"> Female</label>
<label><input type="radio" name="sex" value="Other"> Other</label></p>
<p>Date of Birth:<br>
<select name="dd"><option value="">Day</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select>
<select name="mm"><option value="">Month</option><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select>
<select name="yy"><option value="">Year</option><option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option><option value="1999">1999</option><option value="1998">1998</option><option value="1997">1997</option><option value="1996">1996</option><option value="1995">1995</option><option value="1994">1994</option><option value="1993">1993</option><option value="1992">1992</option><option value="1991">1991</option><option value="1990">1990</option><option value="1989">1989</option><option value="1988">1988</option><option value="1987">1987</option><option value="1986">1986</option><option value="1985">1985</option><option value="1984">1984</option><option value="1983">1983</option><option value="1982">1982</option><option value="1981">1981</option><option value="1980">1980</option><option value="1979">1979</option><option value="1978">1978</option><option value="1977">1977</option><option value="1976">1976</option><option value="1975">1975</option><option value="1974">1974</option><option value="1973">1973</option><option value="1972">1972</option><option value="1971">1971</option><option value="1970">1970</option></select></p>
<p>Languages Known:<br>
<label><input type="checkbox" name="lang" value="English"> English</label>
<label><input type="checkbox" name="lang" value="Telugu"> Telugu</label>
<label><input type="checkbox" name="lang" value="Hindi"> Hindi</label>
<label><input type="checkbox" name="lang" value="Tamil"> Tamil</label></p>
<p>Address:<br><textarea name="address" rows="4" cols="40"></textarea></p>
<input type="submit" value="Register"> <input type="reset" value="Reset">
</form></div></body></html>
