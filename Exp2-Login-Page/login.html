<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1faee; }
        form { width: 320px; margin: 60px auto; padding: 24px; background: #fff; border: 1px solid #ccc; }
        h2 { text-align: center; color: #1d3557; margin-top: 0; }
        td { padding: 8px 4px; }
        input[type=text], input[type=password] { width: 190px; padding: 6px; }
        .center { text-align: center; }
        input[type=submit] { background: #1d3557; color: #fff; border: 0; padding: 8px 24px; cursor: pointer; }
    </style>
</head>
<body>
    <form action="#" method="post">
        <h2>Login</h2>
        <table>
            <tr>
                <td><label for="user">User Name</label></td>
                <td><input type="text" id="user" name="username" required></td>
            </tr>
            <tr>
                <td><label for="pass">Password</label></td>
                <td><input type="password" id="pass" name="password" required></td>
            </tr>
            <tr>
                <td colspan="2" class="center"><input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
