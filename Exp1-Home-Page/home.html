<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>
</head>
<!-- Frameset divides the window: top row, then left + right columns -->
<frameset rows="22%,*">
    <frame src="top.html" name="top" noresize>
    <frameset cols="22%,*">
        <frame src="left.html" name="left">
        <frame src="right.html" name="right">
    </frameset>
</frameset>
</html>
