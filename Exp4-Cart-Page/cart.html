<!DOCTYPE html>
<html>
<head>
    <title>Cart Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #1d3557; }
        table { border-collapse: collapse; width: 360px; }
        th, td { border: 1px solid #999; padding: 10px; }
        th { background: #1d3557; color: #fff; text-align: left; }
        td.price, th.price { text-align: right; }
        tr.total { font-weight: bold; background: #f1faee; }
    </style>
</head>
<body>
    <h2>Your Cart</h2>
    <table>
        <tr><th>Book Name</th><th class="price">Price</th></tr>
        <tr><td>Java 2</td><td class="price">$50</td></tr>
        <tr><td>XML Bible</td><td class="price">$40.5</td></tr>
        <tr><td>HTML in 24 Hours</td><td class="price">$35.5</td></tr>
        <tr class="total"><td>Total Amount</td><td class="price">$126</td></tr>
    </table>
</body>
</html>
