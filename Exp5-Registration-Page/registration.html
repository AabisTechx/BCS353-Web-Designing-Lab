<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1faee; }
        form { width: 520px; margin: 30px auto; padding: 24px; background: #fff; border: 1px solid #ccc; }
        h2 { text-align: center; color: #1d3557; margin-top: 0; }
        td { padding: 8px 4px; vertical-align: top; }
        input[type=text], input[type=password], textarea { width: 250px; padding: 6px; }
        .center { text-align: center; }
        input[type=submit], input[type=reset] { background: #1d3557; color: #fff; border: 0; padding: 8px 22px; cursor: pointer; margin: 0 4px; }
        .error { color: #c1121f; font-size: 12px; display: block; min-height: 14px; }
    </style>
</head>
<body>
    <form name="regForm" action="#" method="post">
        <h2>Registration Form</h2>
        <table>
            <tr>
                <td><label for="name">Name</label></td>
                <td><input type="text" id="name" name="name"></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" id="password" name="password"></td>
            </tr>
            <tr>
                <td><label for="email">E-mail ID</label></td>
                <td><input type="text" id="email" name="email"></td>
            </tr>
            <tr>
                <td><label for="phone">Phone Number</label></td>
                <td><input type="text" id="phone" name="phone"></td>
            </tr>
            <tr>
                <td>Sex</td>
                <td>
                    <input type="radio" id="male" name="sex" value="male" checked><label for="male">Male</label>
                    <input type="radio" id="female" name="sex" value="female"><label for="female">Female</label>
                    <input type="radio" id="other" name="sex" value="other"><label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>
                    <select name="day">
                    <option value="">Day</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>
                    <option value="21">21</option>
                    <option value="22">22</option>
                    <option value="23">23</option>
                    <option value="24">24</option>
                    <option value="25">25</option>
                    <option value="26">26</option>
                    <option value="27">27</option>
                    <option value="28">28</option>
                    <option value="29">29</option>
                    <option value="30">30</option>
                    <option value="31">31</option>
                    </select>
                    <select name="month">
                    <option value="">Month</option>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                    </select>
                    <select name="year">
                    <option value="">Year</option>
                    <option value="2010">2010</option>
                    <option value="2009">2009</option>
                    <option value="2008">2008</option>
                    <option value="2007">2007</option>
                    <option value="2006">2006</option>
                    <option value="2005">2005</option>
                    <option value="2004">2004</option>
                    <option value="2003">2003</option>
                    <option value="2002">2002</option>
                    <option value="2001">2001</option>
                    <option value="2000">2000</option>
                    <option value="1999">1999</option>
                    <option value="1998">1998</option>
                    <option value="1997">1997</option>
                    <option value="1996">1996</option>
                    <option value="1995">1995</option>
                    <option value="1994">1994</option>
                    <option value="1993">1993</option>
                    <option value="1992">1992</option>
                    <option value="1991">1991</option>
                    <option value="1990">1990</option>
                    <option value="1989">1989</option>
                    <option value="1988">1988</option>
                    <option value="1987">1987</option>
                    <option value="1986">1986</option>
                    <option value="1985">1985</option>
                    <option value="1984">1984</option>
                    <option value="1983">1983</option>
                    <option value="1982">1982</option>
                    <option value="1981">1981</option>
                    <option value="1980">1980</option>
                    <option value="1979">1979</option>
                    <option value="1978">1978</option>
                    <option value="1977">1977</option>
                    <option value="1976">1976</option>
                    <option value="1975">1975</option>
                    <option value="1974">1974</option>
                    <option value="1973">1973</option>
                    <option value="1972">1972</option>
                    <option value="1971">1971</option>
                    <option value="1970">1970</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Languages Known</td>
                <td>
                    <input type="checkbox" id="english" name="lang" value="English"><label for="english">English</label>
                    <input type="checkbox" id="telugu" name="lang" value="Telugu"><label for="telugu">Telugu</label>
                    <input type="checkbox" id="hindi" name="lang" value="Hindi"><label for="hindi">Hindi</label>
                    <input type="checkbox" id="tamil" name="lang" value="Tamil"><label for="tamil">Tamil</label>
                </td>
            </tr>
            <tr>
                <td><label for="address">Address</label></td>
                <td><textarea id="address" name="address" rows="4"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" class="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
